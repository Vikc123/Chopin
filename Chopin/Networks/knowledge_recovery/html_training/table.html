<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Таблица мостов</title>
</head>
<body>
  <h1>Характеристики мостов</h1>
  <h2>Поиск мостов</h2>
  <form>
    <div>
      <label for="bridge-name">Название моста</label>
      <input type="text" id="bridge-name" name="bridge_name">
      <button type="submit">Найти</button>
    </div>
  </form>
  <table>
    <thead>
      <tr>
        <th>Название</th>
        <th>Страна</th>
        <th>Год открытия</th>
        <th>Длина, м</th>
      </tr>
    </thead>
    <tbody>
    <tr>
      <td>Русский мост</td>
      <td>Россия</td>
      <td>2012</td>
      <td>1885</td>
    </tr>
    <tr>
      <td>Золотые Ворота</td>
      <td>США</td>
      <td>1937</td>
      <td>2737</td>
    </tr>
    <tr>
      <td>Тауэрский мост</td>
      <td>Великобритания</td>
      <td>1894</td>
      <td>244</td>
    </tr>
    <tr>
      <td>Бруклинский мост</td>
      <td>США</td>
      <td>1883</td>
      <td>1825</td>
    </tr>
    <tr>
      <td>Сиднейский мост</td>
      <td>Австралия</td>
      <td>1932</td>
      <td>1149</td>
    </tr>
    </tbody>
  </table>
  <a href="index.html">На главную</a>
</body>
</html>
